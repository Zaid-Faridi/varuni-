services:
  db:
    image: postgis/postgis:16-3.4
    container_name: watershed-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watershed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-watershed_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watershed_user} -d ${POSTGRES_DB:-watershed_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgis-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ../app/api
    container_name: watershed-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-watershed_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-watershed_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@watershed.gov.in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEMO_MODE=${DEMO_MODE:-0}
      - DEMO_ANALYST_PASSWORD=${DEMO_ANALYST_PASSWORD:-}
      - DEMO_OFFICER_PASSWORD=${DEMO_OFFICER_PASSWORD:-}
      - DEMO_REVIEWER_PASSWORD=${DEMO_REVIEWER_PASSWORD:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3033,http://127.0.0.1:3000,http://127.0.0.1:3033}
      - PORT=${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  web:
    build: ../app/web
    container_name: watershed-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgis-data:
