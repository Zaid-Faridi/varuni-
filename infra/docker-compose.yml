version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: watershed-postgis
    environment:
      POSTGRES_USER: watershed_user
      POSTGRES_PASSWORD: watershed_password
      POSTGRES_DB: watershed_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watershed_user -d watershed_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgis-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ../app/api
    container_name: watershed-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://watershed_user:watershed_password@db:5432/watershed_db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3033,http://127.0.0.1:3000,http://127.0.0.1:3033
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  web:
    build: ../app/web
    container_name: watershed-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgis-data:
