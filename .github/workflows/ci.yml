name: VARUNI CI

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: watershed_user
          POSTGRES_PASSWORD: watershed_password
          POSTGRES_DB: watershed_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watershed_user -d watershed_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/api/requirements.txt

      - name: Install GDAL and system geospatial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libspatialindex-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/api/requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Lint Backend Code
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 app/api --count --select=E9,F63,F7,F82 --show-source --statistics
          # Run flake8 with sensible rules (max-line-length 127) as blocking
          flake8 app/api --count --max-line-length=127 --statistics

      - name: Verify JWT_SECRET_KEY fail-fast enforcement
        run: |
          # Ensure backend refuses startup if JWT_SECRET_KEY is missing or < 32 characters
          python -c "import os, sys; sys.path.insert(0, 'app/api'); os.environ['JWT_SECRET_KEY'] = 'too_short_key'; from services.auth import get_jwt_secret_key; get_jwt_secret_key()" && exit 1 || echo "Confirmed: short JWT key correctly rejected"


      - name: Run Backend Tests (Pytest)
        env:
          CLIP_OFFLINE_MODE: "1"
          DATABASE_URL: "postgresql://watershed_user:watershed_password@localhost:5432/watershed_db"
          JWT_SECRET_KEY: "test_ci_jwt_secret_key_varuni_secure_token"
        run: |
          PYTHONPATH=app/api pytest app/api/tests/ -v

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/web/package.json

      - name: Install Dependencies
        working-directory: app/web
        run: npm ci || npm install

      - name: Lint Frontend Code
        working-directory: app/web
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: app/web
        run: npm test

      - name: Build Next.js Application
        working-directory: app/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
